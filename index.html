<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pão na Chapa · Hamburgueria</title>
  <meta name="description" content="Pão na Chapa: hambúrgueres, porções, bebidas, sobremesas, combos e promoções. Peça online.">
  <meta name="theme-color" content="#0E0D0B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="icon" href="assets/img/icone.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Faixa de avisos (texto vem do painel: Configurações > Aviso do topo) -->
  <div class="aviso" id="aviso" hidden></div>

  <!-- Cabeçalho -->
  <header class="topo" id="topo">
    <div class="topo-in">
      <a class="logo" href="#inicio" aria-label="Pão na Chapa, início">
        <svg class="logo-chama" viewBox="0 0 32 40" aria-hidden="true">
          <defs>
            <linearGradient id="chamaGrad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#D7261E" />
              <stop offset=".45" stop-color="#F26B1D" />
              <stop offset="1" stop-color="#F5B800" />
            </linearGradient>
          </defs>
          <path fill="url(#chamaGrad)"
            d="M16 1c1.6 6.2-2.8 8.9-4.9 13.2C9.6 17.4 10 21 12.4 23c-.3-2.9.9-5.2 3.2-6.9-.2 3.3 1.5 5.4 3.4 7.2 1.9 1.8 2.6 4.5 1.4 6.9 3-1.3 5.1-4.1 5.2-7.6.1-2.6-.9-4.9-2.3-6.9.9 2.4.6 4.3-.8 5.6C23.6 14.6 21.3 6 16 1zM5.5 19.5C3.9 22 3 24.6 3 27.3 3 34.3 8.8 39 16 39s13-4.7 13-11.7c0-1.3-.2-2.5-.6-3.7-.4 5.6-5.6 9.4-12.4 9.4S4.6 30 4.3 25.1c-.1-1.9.3-3.8 1.2-5.6z" />
        </svg>
        <span class="logo-txt">Pão na Chapa</span>
      </a>
      <nav class="nav" aria-label="Principal">
        <a href="#inicio" data-nav="inicio">Início</a>
        <a href="#cardapio" data-nav="cardapio">Cardápio</a>
        <a href="#categoria/combos" data-nav="combos">Combos</a>
        <a href="#categoria/promocoes" data-nav="promocoes">Promoções</a>
        <a href="#novidades" data-nav="novidades">Novidades</a>
      </nav>
      <div class="acoes">
        <button class="ic" id="btnBusca" type="button" aria-label="Buscar no cardápio"><svg viewBox="0 0 24 24"
            aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="M16 16l4.5 4.5" />
          </svg></button>
        <a class="ic ic-perfil" href="#conta" aria-label="Minha conta"><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c1-4.5 4-6.5 8-6.5s7 2 8 6.5" />
          </svg></a>
        <a class="ic ic-sacola" href="#carrinho" aria-label="Carrinho"><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 8h14l-1.2 12.2H6.2z" />
            <path d="M9 8V7a3 3 0 016 0v1" />
          </svg><i class="badge" data-badge hidden>0</i></a>
        <button class="ic ic-menu" id="btnMenu" type="button" aria-label="Abrir menu" aria-expanded="false"
          aria-controls="menuCel"><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h10" />
          </svg></button>
      </div>
    </div>
  </header>

  <!-- Menu do celular -->
  <div class="menu-cel" id="menuCel" hidden>
    <nav aria-label="Menu">
      <a href="#inicio">Início</a>
      <a href="#cardapio">Cardápio</a>
      <a href="#categoria/combos">Combos</a>
      <a href="#categoria/promocoes">Promoções</a>
      <a href="#novidades">Novidades</a>
      <a href="#carrinho">Carrinho</a>
      <a href="#conta">Minha conta</a>
    </nav>
  </div>

  <!-- Busca -->
  <div class="busca" id="busca" hidden>
    <div class="busca-in">
      <input class="campo" id="buscaTexto" type="search" placeholder="Buscar hambúrguer, porção, bebida..."
        aria-label="Buscar no cardápio" autocomplete="off">
      <button class="ic" id="buscaFechar" type="button" aria-label="Fechar busca"><svg viewBox="0 0 24 24"
          aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg></button>
      <div class="busca-res" id="buscaRes"></div>
    </div>
  </div>

  <!-- Páginas (montadas pelo js/app.js) -->
  <main id="app" tabindex="-1"></main>

  <!-- Rodapé -->
  <footer class="rodape" id="rodape"></footer>

  <!-- Barra inferior do celular -->
  <nav class="barra" aria-label="Navegação rápida">
    <a href="#inicio" data-nav="inicio"><svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5" />
      </svg><span>Início</span></a>
    <a href="#cardapio" data-nav="cardapio"><svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg><span>Cardápio</span></a>
    <a href="#carrinho" data-nav="carrinho"><svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 8h14l-1.2 12.2H6.2z" />
        <path d="M9 8V7a3 3 0 016 0v1" />
      </svg><i class="badge" data-badge hidden>0</i><span>Carrinho</span></a>
    <a href="#conta" data-nav="conta"><svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c1-4.5 4-6.5 8-6.5s7 2 8 6.5" />
      </svg><span>Perfil</span></a>
  </nav>

  <!-- Janela de detalhes do produto / formulários do painel -->
  <div class="janela" id="janela" hidden>
    <div class="janela-fundo" data-fechar-janela></div>
    <div class="janela-caixa" role="dialog" aria-modal="true" aria-labelledby="janelaTitulo" id="janelaCaixa"></div>
  </div>

  <div class="aviso-flutuante" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Supabase (biblioteca oficial) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Projeto Pão na Chapa -->
  <script src="js/config.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
