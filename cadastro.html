
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua conta - Pão na Chapa</title>
</head>
<body>

    <header>
        <h1>Pão na Chapa</h1>
    </header>

    <main>

        <section>
            <h2>Você precisa criar uma conta!</h2>

            <p>
                Para finalizar seu pedido, precisamos
                que você faça seu cadastro.
            </p>

            <form id="form-cadastro">

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha"
                    minlength="6" required>

                <button type="submit">
                    Criar minha conta
                </button>

            </form>

            <p>Já possui cadastro?</p>

            <form id="form-login">

                <label for="email-login">E-mail:</label>
                <input type="email" id="email-login" required>

                <label for="senha-login">Senha:</label>
                <input type="password" id="senha-login" required>

                <button type="submit">Entrar</button>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
